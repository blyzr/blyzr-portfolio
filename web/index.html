<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bpjr — web</title>
<meta name="description" content="Web work by Blayze Reid — standalone homepages, live and interactive.">
<meta name="theme-color" content="#0f0f0f">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:CASL,CRSV,MONO,slnt,wght@0..1,0..1,0..1,-15..0,300..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/web/css/web.css">
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>

<main class="stage">
  <header class="hd web-hd">
    <a class="mark web-mark" href="/">bpjr<i class="dot">.</i></a>
    <span class="slot" aria-hidden="true"></span>
    <nav class="navs"><a href="/#work">Work</a><a href="/#about">About</a><a href="/#contact">Contact</a></nav>
  </header>

  <section class="web-hero">
    <a class="web-back" href="/">&larr; Back to index</a>
    <h1>Web.</h1>
    <p class="sub">A handful of homepages, hosted live rather than screenshotted &mdash; scroll them, click around, and flip the viewport to see how each one responds.</p>
  </section>

  <section class="web-grid" id="webGrid"></section>

  <footer class="pg"><a class="contact-email" href="mailto:hello@bpjr.xyz">hello@bpjr.xyz</a> &middot; Oxfordshire, UK</footer>
</main>

<div class="expand-overlay" id="expandOverlay" hidden>
  <div class="expand-panel" id="expandPanel">
    <button class="expand-close" id="expandClose" type="button" aria-label="Close">&times;</button>
    <div class="expand-frame-col">
      <div class="viewport-toggle" id="viewportToggle">
        <button type="button" data-vp="desktop" class="on" aria-label="Desktop view">
          <svg viewBox="0 0 20 16" fill="none"><rect x="1" y="1" width="18" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M7 15h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button type="button" data-vp="mobile" aria-label="Mobile view">
          <svg viewBox="0 0 12 20" fill="none"><rect x="1" y="1" width="10" height="18" rx="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 16.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="expand-frame-wrap" id="expandFrameWrap">
        <div class="expand-scale" id="expandScale">
          <iframe id="expandFrame" title="Site preview"></iframe>
        </div>
      </div>
    </div>
    <div class="expand-details">
      <span class="ed-kicker" id="edKicker"></span>
      <h2 id="edTitle"></h2>
      <p class="ed-sub" id="edSub"></p>
      <p class="ed-blurb" id="edBlurb"></p>
      <span class="tools" id="edTags"></span>
      <a class="row-link" id="edLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open live site &#8599;</a>
    </div>
  </div>
</div>

<script src="/web/js/web.js"></script>
</body>
</html>
